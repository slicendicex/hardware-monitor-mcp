[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "hardware-monitor-mcp"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["mcp==1.28.0", "psutil==7.2.2", "nvidia-ml-py==13.580.82"]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[tool.setuptools.packages.find]
where = ["src"]
